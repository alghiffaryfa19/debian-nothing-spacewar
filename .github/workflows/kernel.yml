name: 🛠️ Build Kernel & Device Packages

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version tag (e.g. 7.2)"
        required: true
        default: "7.2"

jobs:
  build:
    name: "Build Kernel v${{ github.event.inputs.kernel_version || '7.2' }}"
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: "💾 Setup ccache"
        uses: actions/cache@v4
        id: cache-ccache
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-ccache-kernel-${{ github.event.inputs.kernel_version || '7.2' }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-ccache-kernel-${{ github.event.inputs.kernel_version || '7.2' }}-
            ${{ runner.os }}-ccache-kernel-

      - name: "🔧 Install build dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev bc \
            ccache clang llvm lld kmod cpio curl wget git dpkg-dev
          mkdir -p /home/runner/.ccache
          ccache --set-config=max_size=10G
          ccache --set-config=cache_dir=/home/runner/.ccache
          ccache --set-config=sloppiness=file_macro,locale,time_macros

      - name: "🔨 Build kernel, firmware, and ALSA UCM .deb packages"
        run: |
          export CCACHE_DIR=/home/runner/.ccache
          export CCACHE_MAXSIZE=10G
          export PATH="/usr/lib/ccache:$PATH"
          chmod +x spacewar-kernel_build.sh
          ./spacewar-kernel_build.sh
          ccache --show-stats || true

      - name: "📦 Verify built .deb packages"
        id: collect_artifacts
        run: |
          ls -lah *.deb
          PKG_COUNT=$(ls -1 *.deb 2>/dev/null | wc -l)
          echo "pkg_count=$PKG_COUNT" >> "$GITHUB_OUTPUT"

      - name: "📤 Upload .deb artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.event.inputs.kernel_version || '7.2' }}
          path: "*.deb"
          retention-days: 7
          if-no-files-found: error

      - name: "🏷️ Publish GitHub Release"
        if: steps.collect_artifacts.outputs.pkg_count > 0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.event.inputs.kernel_version || '7.2' }}
          name: "Kernel ${{ github.event.inputs.kernel_version || '7.2' }}"
          body: |
            🧩 Nothing Phone (1) (`spacewar`) Mainline Kernel ${{ github.event.inputs.kernel_version || '7.2' }} (with Spacewar patch series from `arch-nothing-spacewar`)

            ### 📦 Included Packages
            - `linux-nothing-spacewar.deb` (`/boot/Image`, `/boot/Image.gz`, `/boot/vmlinuz`, `/boot/dtbs/qcom/sm7325-nothing-spacewar.dtb`, kernel modules)
            - `firmware-nothing-spacewar.deb`
            - `alsa-nothing-spacewar.deb` (ALSA UCM2 + WirePlumber S16LE rule)
          draft: false
          prerelease: false
          files: "*.deb"
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
