name: 🐧 Build Debian Forky RootFS & Boot Image (Single-Boot userdata)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel release tag to use (e.g. 7.2)"
        required: true
        default: "7.2"
      enable_droidloom:
        description: "Include Droidloom Android runtime"
        required: false
        type: boolean
        default: true
      enable_gapps:
        description: "Inject LiteGapps (Android 17 / API 37) into Droidloom"
        required: false
        type: boolean
        default: true
      skip_release:
        description: "Skip creating GitHub Release"
        required: false
        type: boolean
        default: false

jobs:
  build-rootfs:
    name: "🏗️ Build Debian Forky (Denial + Droidloom + GApps)"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: "🧹 Maximize runner disk space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🔧 Install host build dependencies & Rust 1.93.0"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap curl wget gnupg ca-certificates \
            e2fsprogs util-linux android-sdk-libsparse-utils mkbootimg \
            libarchive-tools zstd xz-utils erofs-utils attr fakeroot \
            aapt apksigner default-jre-headless build-essential pkg-config
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.0 --profile minimal
          else
            rustup toolchain install 1.93.0 --profile minimal
            rustup default 1.93.0
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: "📥 Download device & kernel .deb packages from Releases"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERNEL_VER: ${{ github.event.inputs.kernel_version || '7.2' }}
        run: |
          for tag in "msm-modem" "bootmac" "q6voiced" "pd-mapper" "soc-qcom" "kernel-${KERNEL_VER}"; do
            echo "⬇️ Downloading .deb packages from release: ${tag}"
            gh release download "${tag}" --pattern "*.deb" --repo "${{ github.repository }}" --clobber || true
          done
          # Build local pd-mapper / soc-qcom / alsa-nothing-spacewar fallback if not in release
          if [[ ! -f pd-mapper.deb && -d pd-mapper ]]; then
            chmod 755 pd-mapper/DEBIAN/postinst pd-mapper/DEBIAN/postrm
            dpkg-deb --build --root-owner-group pd-mapper
          fi
          if [[ ! -f soc-qcom.deb && -d soc-qcom ]]; then
            dpkg-deb --build --root-owner-group soc-qcom
          fi
          if [[ ! -f alsa-nothing-spacewar.deb && -d alsa-nothing-spacewar ]]; then
            dpkg-deb --build --root-owner-group alsa-nothing-spacewar
          fi
          ls -lah *.deb

      - name: "🏗️ Run spacewar-rootfs_build.sh"
        env:
          ENABLE_DROIDLOOM: ${{ github.event.inputs.enable_droidloom }}
          ENABLE_GAPPS: ${{ github.event.inputs.enable_gapps }}
        run: |
          chmod +x spacewar-rootfs_build.sh
          sudo env "PATH=$HOME/.cargo/bin:$PATH" \
            ENABLE_DROIDLOOM="${ENABLE_DROIDLOOM}" \
            ENABLE_GAPPS="${ENABLE_GAPPS}" \
            SPLIT_ROOTFS="true" \
            SPLIT_SIZE="1900M" \
            bash ./spacewar-rootfs_build.sh

      - name: "📂 Prepare release files"
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          ls -lh out/

      - name: "📤 Upload build artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: debian-forky-spacewar-userdata
          path: |
            out/boot.img
            out/spacewar-rootfs*.zst*
            out/packages.txt
            out/root.uuid
            out/SHA256SUMS
            out/SHA256SUMS.zst
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: "🚀 Publish GitHub Release"
        if: ${{ !github.event.inputs.skip_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rootfs-${{ github.run_number }}-${{ github.event.inputs.kernel_version || '7.2' }}
          name: "Debian Forky (Denial + Droidloom + GApps) for Nothing Phone (1) - #${{ github.run_number }}"
          body: |
            🐧 **Debian Forky (`arm64`) Single-Boot (`userdata`) for Nothing Phone (1) (`spacewar`)**

            ### 📋 Build Configuration
            - **Distribution**: Debian `forky` (`arm64`)
            - **Boot Mode**: Single-boot on `userdata` (`x-systemd.growfs` auto-expand on first boot)
            - **Boot Image**: Built with `spacewar-mkbootimg` (`Image.gz-dtb` + header v2, referenced from `arch-nothing-spacewar`)
            - **Desktop Environment**: [Denial WM](https://denialwm.org) (`DENIAL_SHELL_PROFILE=mobile`, SDDM autologin)
            - **Android Runtime**: [Droidloom](https://github.com/denialwm/droidloom) (`aarch64`) + **LiteGapps Android 17 / API 37** pre-injected at `/usr/lib/droidloom/addons/gapps`
            - **Default Credentials**:
              - User: `user` / `147258` (autologin enabled)
              - Root: `root` / `1234`

            ### ⚡ Flashing Instructions (Single-Boot `userdata`)
            1. Decompress the sparse rootfs image:
               ```bash
               # If split into parts:
               cat spacewar-rootfs.sparse.img.zst.part* | unzstd -o spacewar-rootfs.sparse.img
               # Or if single file:
               unzstd spacewar-rootfs.sparse.img.zst
               ```
            2. Verify checksums:
               ```bash
               sha256sum -c SHA256SUMS
               ```
            3. Flash via Fastboot:
               ```bash
               fastboot flash boot_a boot.img
               fastboot flash boot_b boot.img
               fastboot flash userdata spacewar-rootfs.sparse.img
               fastboot reboot
               ```
          files: |
            out/boot.img
            out/spacewar-rootfs*.zst*
            out/packages.txt
            out/root.uuid
            out/SHA256SUMS
            out/SHA256SUMS.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
